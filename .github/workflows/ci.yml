name: CI

on:
  pull_request:
  push:
    branches:
      - ccr-0014c7e1-32mc28

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the ephemeral CI container only; not a secret.
          POSTGRES_USER: akiba
          POSTGRES_PASSWORD: akiba_ci_only
          POSTGRES_DB: akiba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akiba -d akiba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      # The Postgres service above. Used by `prisma migrate`, the seed and the API tests (which
      # create and drop their own akiba_t_* databases on this server).
      DATABASE_URL: postgresql://akiba:akiba_ci_only@localhost:5432/akiba_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations (empty Postgres 16)
        run: pnpm db:migrate

      - name: Check migration status and schema drift
        run: pnpm db:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Seed twice (must be idempotent)
        run: |
          node apps/api/dist/db/seedCli.js
          node apps/api/dist/db/seedCli.js
