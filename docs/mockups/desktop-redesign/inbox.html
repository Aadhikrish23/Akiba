<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · Akiba · Ticket Stub Night (desktop mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300..900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ticket-night.css">
<link rel="stylesheet" href="pages.css">
<style>
  h1.greet.sm { font-size: clamp(44px, 4.6vw, 68px); }
  .inbox { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 40px; align-items: start; }
  .listcol .toolbar { margin-bottom: 8px; }
  .day { font: 800 20px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 26px 0 10px; color: var(--mute); display: flex; justify-content: space-between; align-items: baseline; }
  .day:first-of-type { margin-top: 14px; }
  .msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .msg {
    appearance: none; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    background: var(--night-2); border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 14px 8px 8px;
    transition: border-color .15s, background .15s;
  }
  .msg:hover { border-color: var(--mute); }
  .msg[aria-current="true"] { border-color: var(--text); background: var(--night-3); }
  .msg img { width: 44px; height: 62px; object-fit: cover; border-radius: 4px; display: block; }
  .msg b { display: block; font-weight: 700; font-size: 15px; line-height: 1.2; }
  .msg span { color: var(--mute); font-size: 13px; }
  .msg.read b { font-weight: 500; color: var(--mute); }
  .msg .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--punch); }
  .msg.read .dot { background: transparent; border: 2px solid var(--rule); }
  .hint { color: var(--mute); font-size: 13px; margin: 22px 0 0; }
  .hint kbd { font: 500 12px var(--sans); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px; color: var(--text); }

  .detail { position: sticky; top: 22px; }
  .detail .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .detail .ticket.hero { min-height: 300px; }
  .detail .ticket.hero h3 { font-size: 46px; }
  .detail .ticket.hero .num { font-size: 96px; }
  .detail .ticket.hero.done { background: color-mix(in oklab, var(--stock) 36%, var(--night-3)); color: var(--text); }
  .detail .ticket.hero.done .badge { background: transparent; color: var(--text); border: 1.5px solid oklch(95% .012 90 / .45); }
  .detail .ticket.hero.done .badge::before { display: none; }
  .detail .ticket.hero.done .perf { border-color: oklch(95% .012 90 / .35); }
  .detail .ticket.hero.done .bars { display: none; }
  .none { border: 1.5px dashed var(--rule); border-radius: 14px; padding: 60px 30px; text-align: center; color: var(--mute); }
  .none b { display: block; color: var(--text); font: 800 34px var(--display); text-transform: uppercase; margin-bottom: 6px; }

  .back-m { display: none; }
  @media (max-width: 820px) {
    h1.greet.sm { font-size: 46px; }
    .inbox { grid-template-columns: 1fr; gap: 0; }
    .inbox:not(.show-detail) .detail { display: none; }
    .inbox.show-detail .listcol { display: none; }
    .back-m { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--mute); background: none; border: 0; font: 500 14px var(--sans); cursor: pointer; padding: 0; margin-bottom: 8px; }
    .back-m .ico { width: 16px; height: 16px; }
    .msg { padding: 10px 14px 10px 10px; min-height: 76px; }
    .hint { display: none; }
    .detail { position: static; }
    .detail .ticket.hero { min-height: 188px; }
    .detail .ticket.hero h3 { font-size: 27px; }
    .detail .ticket.hero .num { font-size: 58px; }
    .detail .acts { gap: 8px; }
    .detail .acts .btn { flex: 1 1 calc(50% - 8px); height: 46px; }
    .detail .acts #dismiss { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <script src="shell.js" data-active="inbox"></script>
  <main class="page">
    <div data-top></div>

    <div class="inbox">
      <section class="listcol" aria-label="Notifications">
        <h1 class="greet sm">Aired<br><span>for you.</span></h1>
        <p class="lede" id="lede" style="margin-bottom:18px"></p>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Filter">
            <button type="button" id="fUnread" aria-pressed="true">Unread</button>
            <button type="button" id="fAll" aria-pressed="false">All</button>
          </div>
          <button class="btn ghost" type="button" id="markAll" style="margin-left:auto;height:38px;padding:0 16px;font-size:13px">Mark all read</button>
        </div>
        <div id="msgs"></div>
        <p class="hint"><kbd>J</kbd> and <kbd>K</kbd> move through the list, <kbd>S</kbd> stamps the episode.</p>
      </section>

      <section class="detail" id="detail" aria-live="polite" aria-label="Selected notification"><div id="detailBody"></div></section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>
<script>
(function () {
  'use strict';
  var CHECK = Shell.icon('check', 'chk');
  var shows = {
    kus:  { name: 'Kusuriya no Hitorigoto 3rd Season', jp: '薬屋のひとりごと 第3期', img: 'covers/195516.jpg', c: '#e4a128', n: 12, w: 7, ch: 'Fuji TV' },
    jojo: { name: 'JoJo: Steel Ball Run', jp: 'ジョジョの奇妙な冒険 スティール・ボール・ラン', img: 'covers/210482.jpg', c: '#f1ae50', n: 11, w: 8, ch: 'Tokyo MX' },
    hota: { name: 'Hotaru no Yomeiri', jp: 'ホタルの嫁入り', img: 'covers/205909.jpg', c: '#aebb35', n: 12, w: 7, ch: 'TV Asahi' },
    toky: { name: 'Tokyo Revengers: Santen Sensou', jp: '東京リベンジャーズ 三天戦争編', img: 'covers/178083.jpg', c: '#c99350', n: 13, w: 5, ch: 'MBS' },
    toug: { name: 'Tougen Anki: Nikko Kegon', jp: '桃源暗鬼 日光・華厳の滝編', img: 'covers/204650.png', c: '#5aa6ee', n: 12, w: 8, ch: 'BS11' }
  };
  var msgs = [
    { id: 1, s: 'kus', ep: 8, ago: '2h ago', at: 'Tue 22:00', day: 'Today', unread: true },
    { id: 2, s: 'jojo', ep: 9, ago: '5h ago', at: 'Tue 18:30', day: 'Today', unread: true },
    { id: 3, s: 'toky', ep: 8, ago: 'Monday night', at: 'Mon 25:53', day: 'Yesterday', unread: true },
    { id: 4, s: 'toug', ep: 8, ago: 'Monday', at: 'Mon 23:00', day: 'Yesterday', unread: false },
    { id: 5, s: 'hota', ep: 7, ago: 'Wed 18 Nov', at: 'Wed 23:30', day: 'Earlier', unread: false },
    { id: 6, s: 'kus', ep: 7, ago: 'Tue 17 Nov', at: 'Tue 22:00', day: 'Earlier', unread: false },
    { id: 7, s: 'toug', ep: 7, ago: 'Mon 16 Nov', at: 'Mon 23:00', day: 'Earlier', unread: false }
  ];
  var removed = [], sel = 1, unreadOnly = true, lastUndo = null, tt;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, '&amp;'); }
  function isPhone() { return window.matchMedia('(max-width: 820px)').matches; }
  function unreadCount() { return msgs.filter(function (m) { return m.unread; }).length; }
  function visible() { return msgs.filter(function (m) { return !unreadOnly || m.unread || m.id === sel; }); }

  function renderList() {
    var list = visible(), out = '', day = '';
    list.forEach(function (m) {
      if (m.day !== day) { if (day) out += '</ul>'; day = m.day; out += '<div class="day"><span>' + day + '</span></div><ul class="msgs">'; }
      var sh = shows[m.s];
      out += '<li><button type="button" class="msg ' + (m.unread ? 'unread' : 'read') + '" data-id="' + m.id + '" aria-current="' + (m.id === sel) + '">' +
        '<img src="' + sh.img + '" alt="" width="44" height="62"><span><b>' + esc(sh.name) + '</b><span>Episode ' + m.ep + ' aired · ' + m.ago + '</span></span>' +
        '<i class="dot" aria-label="' + (m.unread ? 'unread' : 'read') + '"></i></button></li>';
    });
    if (day) out += '</ul>';
    $('msgs').innerHTML = out || '<div class="empty" style="margin-top:14px"><b>All stamped</b>Nothing new has aired. Check the schedule for tonight.</div>';
    var u = unreadCount();
    $('lede').innerHTML = u ? '<b>' + u + ' new</b> since you last looked. Stamp them or let them wait.' : '<b>Nothing new.</b> Every aired episode has been seen.';
    var ct = document.getElementById('inboxCt'); if (ct) { ct.textContent = u; ct.hidden = !u; ct.setAttribute('aria-label', u + ' unread'); }
  }

  function renderDetail(stamped) {
    var m = msgs.filter(function (x) { return x.id === sel; })[0];
    if (!m) { $('detail').innerHTML = '<div class="none"><b>Pick an episode</b>Select a notification to see its ticket.</div>'; return; }
    var sh = shows[m.s], caught = sh.w >= m.ep, behind = Math.max(0, m.ep - sh.w);
    var nextEp = sh.w + 1;
    var badge = caught ? 'Stamped' : 'Aired ' + m.ago;
    var stub = caught
      ? '<button class="plus" type="button" disabled aria-label="Episode ' + m.ep + ' is stamped">' + CHECK + '</button>'
      : '<button class="plus" type="button" id="stamp" aria-label="Log episode ' + nextEp + ' of ' + esc(sh.name) + '">+1<small>EP ' + nextEp + '</small></button>';
    var line = caught ? 'You are at ' + sh.w + ' of ' + sh.n + '.' : (behind > 1 ? behind + ' episodes behind: stamping logs episode ' + nextEp + ' first.' : 'You are 1 behind.');
    $('detail').innerHTML = '<button class="back-m" type="button" id="backList">' + Shell.icon('left', 'ico') + 'Inbox</button>' +
      '<article class="ticket hero' + (caught ? ' done' : '') + (stamped ? ' stamped' : '') + '" style="--stock:' + sh.c + ';--p:' + (sh.w / sh.n).toFixed(3) + '">' +
      '<div class="cover"><img src="' + sh.img + '" alt="" width="188" height="300"></div>' +
      '<div class="body"><div><span class="badge">' + badge + '</span><h3 style="margin-top:12px"><a href="title.html">' + esc(sh.name) + '</a></h3><p class="jp">' + sh.jp + '</p></div>' +
      '<p class="meta" style="font-size:15px">Episode ' + m.ep + ' · ' + m.at + ' · ' + sh.ch + '</p>' +
      '<div><div class="meta">' + line + '</div><div class="serial">NO. ' + String(m.id).padStart(4, '0') + ' · AIRED</div></div></div>' +
      '<div class="stub"><div class="num"><span>' + String(sh.w).padStart(2, '0') + '</span><small> /' + sh.n + '</small></div>' + stub + '<div class="bars" aria-hidden="true"></div></div>' +
      '<div class="perf" aria-hidden="true"></div><div class="stamp" aria-hidden="true"><div><b>観了</b><span>EP ' + sh.w + '</span></div></div></article>' +
      '<div class="acts"><button class="btn ghost" type="button" id="toggleRead">' + (m.unread ? 'Mark as read' : 'Mark as unread') + '</button>' +
      '<button class="btn ghost" type="button" id="remind">Remind me tomorrow</button>' +
      '<a class="btn ghost" href="title.html">Open title</a>' +
      '<button class="btn ghost" type="button" id="dismiss" style="margin-left:auto">Dismiss</button></div>';
  }

  function select(id, keepFocus) { sel = id; renderList(); renderDetail(); if (keepFocus) { var f = document.querySelector('.msg[data-id="' + id + '"]'); if (f) f.focus(); } }
  function toast(msg, undo) {
    $('toastMsg').textContent = msg; lastUndo = undo; $('toastUndo').hidden = !undo;
    $('toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { $('toast').classList.remove('on'); }, 6000);
  }
  $('toastUndo').addEventListener('click', function () { if (lastUndo) lastUndo(); $('toast').classList.remove('on'); });

  function current() { return msgs.filter(function (x) { return x.id === sel; })[0]; }
  function stamp() {
    var m = current(); if (!m) return; var sh = shows[m.s]; if (sh.w >= m.ep) return;
    sh.w += 1; msgs.forEach(function (x) { if (x.s === m.s && x.ep <= sh.w) x.unread = false; });
    renderList(); renderDetail(true); toast(sh.name + ': episode ' + sh.w + ' stamped.', null);
    var b = $('stamp'); if (b) b.focus();
  }

  $('msgs').addEventListener('click', function (e) { var b = e.target.closest('.msg'); if (!b) return; var m = msgs.filter(function (x) { return x.id === +b.dataset.id; })[0]; select(m.id, true); if (isPhone()) document.querySelector('.inbox').classList.add('show-detail'); if (m.unread) { m.unread = false; renderList(); var f = document.querySelector('.msg[data-id="' + m.id + '"]'); if (f) f.focus(); } });
  $('detail').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return; var m = current();
    if (t.id === 'stamp') stamp();
    if (t.id === 'backList') { document.querySelector('.inbox').classList.remove('show-detail'); var bf = document.querySelector('.msg[data-id="' + sel + '"]'); if (bf) bf.focus(); }
    if (t.id === 'toggleRead') { m.unread = !m.unread; renderList(); renderDetail(); }
    if (t.id === 'remind') toast('Reminder set for tomorrow, 7:00 pm.', null);
    if (t.id === 'dismiss') {
      var i = msgs.indexOf(m); msgs.splice(i, 1); var nx = msgs[i] || msgs[i - 1]; sel = nx ? nx.id : 0;
      renderList(); renderDetail(); if (isPhone()) document.querySelector('.inbox').classList.remove('show-detail');
      toast('Notification dismissed.', function () { msgs.splice(i, 0, m); sel = m.id; renderList(); renderDetail(); });
    }
  });
  function setFilter(u) { unreadOnly = u; $('fUnread').setAttribute('aria-pressed', u); $('fAll').setAttribute('aria-pressed', !u); renderList(); }
  $('fUnread').addEventListener('click', function () { setFilter(true); });
  $('fAll').addEventListener('click', function () { setFilter(false); });
  $('markAll').addEventListener('click', function () {
    var was = msgs.filter(function (m) { return m.unread; }); if (!was.length) return;
    was.forEach(function (m) { m.unread = false; }); renderList(); renderDetail();
    toast(was.length + ' marked as read.', function () { was.forEach(function (m) { m.unread = true; }); renderList(); renderDetail(); });
  });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey) return;
    var list = visible(), i = list.map(function (m) { return m.id; }).indexOf(sel);
    if (e.key === 'j' && i < list.length - 1) select(list[i + 1].id, true);
    if (e.key === 'k' && i > 0) select(list[i - 1].id, true);
    if (e.key === 's') stamp();
  });

  renderList(); renderDetail();
})();
</script>
</body>
</html>
